[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fantasy-football"
version = "0.1.0"
description = "NFL/fantasy data pipelines (nflreadpy, Sleeper, play-by-play enrichment) feeding Dynasty Tycoon"
requires-python = ">=3.10"
dependencies = [
    "pandas-gbq",
    "google-cloud-bigquery",
    "pandas",
    "nflreadpy",
    "sleeper-api-wrapper",
    "polars",
]

[project.optional-dependencies]
# The pbp pipeline loads parquet via polars and writes through the BigQuery
# client's dataframe path, which needs pyarrow and db-dtypes explicitly.
pbp = [
    "pyarrow",
    "db-dtypes",
]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

