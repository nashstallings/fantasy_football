name: PBP Weekly Update

on:
  schedule:
    # Tuesday 12:00 UTC, after Monday night wraps. GitHub cron is best-effort
    # and can skip a firing entirely, so run_weekly.py rebuilds the whole
    # current season rather than just "the new week" -- a missed run repairs
    # itself on the next one.
    - cron: '0 12 * * 2'
  workflow_dispatch: {}

# Two overlapping runs would race on the same MERGE target.
concurrency:
  group: pbp-write
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write    # required for Workload Identity Federation
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install
        run: pip install -e ".[pbp]"

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Run weekly update
        env:
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
        run: python jobs/run_weekly.py
