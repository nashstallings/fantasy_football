name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install
        run: pip install -e ".[pbp,dev]"

      # No GCP auth step: the silver/gold transforms are pure functions over
      # fixture frames, so the suite runs on a fork PR with no secrets.
      - name: Run tests
        run: pytest tests/ -q
